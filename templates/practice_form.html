{% extends "base.html" %}
{% block title %}{{ 'Edit' if practice else 'New' }} Practice — Coaching Hub{% endblock %}
{% block content %}
<h1>{{ 'Edit' if practice else 'New' }} Practice Plan</h1>

<div class="card">
  <form method="post">
    <div class="form-row">
      <div class="form-group">
        <label for="date">Date *</label>
        <input type="date" id="date" name="date" required value="{{ practice.date if practice else '' }}">
      </div>
      <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" name="title" required placeholder="e.g. Speed day, Long run, Race prep"
               value="{{ practice.title if practice else '' }}">
      </div>
    </div>

    <div class="form-group">
      <label for="warmup">Warm-up</label>
      <textarea id="warmup" name="warmup" placeholder="e.g. 1 mile easy jog, drills, strides">{{ practice.warmup if practice else '' }}</textarea>
    </div>

    <div class="form-group">
      <label for="main_workout">Main Workout</label>
      <textarea id="main_workout" name="main_workout" placeholder="e.g. 6x800m @ 5K pace, 2 min rest">{{ practice.main_workout if practice else '' }}</textarea>
    </div>

    <div class="form-group">
      <label for="cooldown">Cool-down</label>
      <textarea id="cooldown" name="cooldown" placeholder="e.g. 10 min easy, stretching">{{ practice.cooldown if practice else '' }}</textarea>
    </div>

    <div class="form-group">
      <label for="notes">Coaching Notes</label>
      <textarea id="notes" name="notes" placeholder="Reminders, focus points, individual adjustments...">{{ practice.notes if practice else '' }}</textarea>
    </div>

    <div class="btn-group">
      <button type="submit" class="btn btn-primary">{{ 'Save Changes' if practice else 'Create Practice' }}</button>
      <a href="{{ url_for('practices') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
